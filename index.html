<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <meta name="description" content="Anttu's homepage" />
        <title>Anttu's homepage</title>

        <link rel="stylesheet" href="static/css/bootstrap.min.css" />
        <link rel="stylesheet" href="static/css/main.css?v=1.0" />
        <link rel="stylesheet" href="static/css/fonts.css" />

        <link rel="apple-touch-icon" sizes="180x180" href="static/images/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="static/images/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="static/images/favicon-16x16.png" />

        <script defer src="static/js/fontawesome.js"></script>
        <script defer src="static/js/main.js?v=1.1"></script>
        <script defer src="static/js/alpine.min.js"></script>
    </head>

    <body x-data="siteApp()">
        <!-- ================= MAIN HOME NAVIGATION ================= -->
        <main x-show="!showCV">
            <b><h1 class="main-headers" id="main-header">Welcome!</h1></b>
            <hr style="text-align: center" />
            <div class="main-social">
                <div class="main-social-link-div col-12 text-center mb-2">
                    <!-- Click triggers full-page swap to CV -->
                    <a
                        class="main-social-link"
                        href="#"
                        @click.prevent="openCV()"
                        ><ins>CV</ins></a
                    >
                </div>
                <div class="main-social-link-div">
                    <a
                        class="main-social-link"
                        href="https://www.linkedin.com/in/anttu-suhonen"
                        target="_blank"
                        ><ins>LinkedIn</ins></a
                    >
                </div>
                <div class="main-social-link-div">
                    <a
                        class="main-social-link"
                        href="https://github.com/anttus/"
                        target="_blank"
                        ><ins>GitHub</ins></a
                    >
                </div>
                <div class="main-social-link-div">
                    <a
                        class="main-social-link"
                        style="font-size: 20px"
                        href="https://soundcloud.com/wind_child/"
                        target="_blank"
                        ><ins>Music</ins></a
                    >
                </div>
                <div class="main-social-link-div">
                    <a
                        class="main-social-link"
                        style="font-size: 20px"
                        href="https://soundcloud.com/friedland-project/"
                        target="_blank"
                        ><ins>More music</ins></a
                    >
                </div>
            </div>
            <hr style="text-align: center" />
        </main>

        <!-- DYNAMIC CV -->
        <div x-show="showCV" style="display: none">
            <!--<div class="container my-3 no-print">
                <a
                    href="#"
                    @click.prevent="closeCV()"
                    class="btn btn-outline-secondary btn-sm"
                    style="border-radius: 10%"
                    >&larr; Back</a
                >
            </div>-->

            <!-- Loading state -->
            <div x-show="loading" class="text-center my-5">
                <p>Loading...</p>
            </div>

            <!-- Error state -->
            <div x-show="error" class="text-center text-danger my-5">
                <p
                    x-text="errorMessage || 'Sorry, failed to load CV. Please try again later.'"
                ></p>
                <button
                    class="btn btn-primary btn-sm mt-2"
                    @click="fetchGistCV()"
                >
                    Retry
                </button>
            </div>

            <!-- Main CV Body -->
            <div x-show="!loading && !error" class="container-fluid overcover">
                <div class="container profile-box">
                    <div class="row">
                        <!-- Left Sidebar -->
                        <div class="col-md-4 left-co">
                            <div class="left-side">
                                <div class="profile-info">
                                    <img
                                        src="static/images/profile_pic2.png"
                                        alt="profile picture"
                                    />
                                    <h3 x-text="data.misc.name"></h3>
                                    <span>DevOps | Cloud</span>
                                </div>

                                <div class="no-print">
                                    <h4 class="ltitle">Sites</h4>
                                    <ul class="row social-link no-margin">
                                        <li>
                                            <a
                                                :href="data.misc.linkedin"
                                                target="_blank"
                                                alt="linkedin_profile"
                                                ><i
                                                    class="social-link fab fa-linkedin"
                                                ></i
                                            ></a>
                                        </li>
                                        <li>
                                            <a
                                                :href="data.misc.github"
                                                target="_blank"
                                                alt="github_profile"
                                                ><i
                                                    class="social-link fab fa-github"
                                                ></i
                                            ></a>
                                        </li>
                                    </ul>
                                </div>

                                <h4 class="ltitle">Contact</h4>
                                <div class="contact-box pb0">
                                    <div
                                        class="detail"
                                        x-text="data.misc.email"
                                    ></div>
                                </div>
                                <div class="contact-box">
                                    <i class="icon fas fa-map-marker-alt"></i>
                                    <div
                                        class="detail"
                                        x-text="data.misc.location"
                                    ></div>
                                </div>

                                <div class="no-print">
                                    <h4 class="ltitle">Hobbies</h4>
                                    <ul class="hobby row no-print">
                                        <li>
                                            <i class="fas fa-music"></i> <br />
                                            Music
                                        </li>
                                        <li>
                                            <i
                                                class="fa-solid fa-person-running"
                                            ></i>
                                            <br />
                                            Running
                                        </li>
                                        <li>
                                            <i class="fas fa-gamepad"></i>
                                            <br />
                                            Gaming
                                        </li>
                                    </ul>
                                </div>

                                <div class="no-print">
                                    <h4 class="ltitle">Save the CV</h4>
                                    <button
                                        class="print-button"
                                        onclick="
                                            window.print();
                                            return false;
                                        "
                                    >
                                        Click to print
                                        <i class="fas fa-print"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Right Main Content -->
                        <div class="col-md-8 rt-div">
                            <div class="rit-cover">
                                <div class="hotkey">
                                    <a
                                        class="main-social-link"
                                        href="#"
                                        @click.prevent="closeCV()"
                                        style="padding: 0px"
                                    >
                                        <div>
                                            <ins
                                                ><h1
                                                    class="rtitle"
                                                    x-text="data.misc.name"
                                                ></h1
                                            ></ins>
                                        </div>
                                    </a>
                                    <small>DevOps & Cloud Engineer</small>
                                </div>

                                <!-- Profile / About Section -->
                                <h2 class="no-print rit-titl">
                                    <img
                                        src="static/images/favicon-32x32.png"
                                        alt="profile picture"
                                    />
                                    Profile
                                </h2>
                                <div class="about">
                                    <section class="textlist text-left">
                                        <p>
                                            <template
                                                x-for="text in data.about.texts"
                                            >
                                                <span
                                                    x-text="text + ' '"
                                                    style="display: inline"
                                                ></span>
                                            </template>
                                        </p>
                                    </section>
                                </div>

                                <!-- Work Experience Section -->
                                <h2 class="rit-titl">
                                    <i class="fas fa-briefcase"></i>
                                    <span
                                        x-text="data.experience.header"
                                    ></span>
                                </h2>
                                <div class="work-exp">
                                    <template
                                        x-for="job in data.experience.jobs"
                                    >
                                        <li>
                                            <h6>
                                                <strong
                                                    x-text="job.title"
                                                ></strong>
                                                <span x-text="job.time"></span>
                                            </h6>
                                            <i><ins x-text="job.place"></ins></i
                                            ><br />
                                            <span
                                                x-text="job.description"
                                            ></span
                                            ><br /><br />
                                        </li>
                                    </template>
                                </div>

                                <!-- Education Section -->
                                <h2 class="rit-titl">
                                    <i class="fas fa-graduation-cap"></i>
                                    <span x-text="data.education.header"></span>
                                </h2>
                                <div class="education">
                                    <ul class="row no-margin">
                                        <template
                                            x-for="edu in data.education.education"
                                        >
                                            <li class="col-md-6">
                                                <span x-text="edu.time"></span>
                                                <br />
                                                <span
                                                    x-text="edu.degree + ' - ' + edu.place"
                                                ></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>

                                <!-- Certifications Section -->
                                <h2 class="rit-titl">
                                    <i class="fas fa-certificate"></i>
                                    <span
                                        x-text="data.certifications.header"
                                    ></span>
                                </h2>
                                <div class="certification">
                                    <ul class="row no-margin">
                                        <template
                                            x-for="cert in data.certifications.data"
                                        >
                                            <li class="col-12 sb-1">
                                                <i class="fa-solid fa-link"></i>
                                                <a
                                                    class="text-link"
                                                    target="_blank"
                                                    :href="cert.link"
                                                    x-text="cert.name"
                                                ></a>
                                            </li>
                                        </template>
                                    </ul>
                                </div>

                                <!-- Projects Section -->
                                <h2 class="rit-titl">
                                    <i class="fas fa-certificate"></i>
                                    <span x-text="data.projects.header"></span>
                                </h2>
                                <div class="project">
                                    <ul class="row no-margin">
                                        <template
                                            x-for="proj in data.projects.data"
                                        >
                                            <li class="col-12 sb-1">
                                                <span
                                                    x-text="proj.description"
                                                ></span
                                                ><br />
                                                <i
                                                    class="far fa-hand-point-right"
                                                ></i>
                                                <a
                                                    class="text-link"
                                                    target="_blank"
                                                    :href="proj.link"
                                                    x-text="proj.link_title"
                                                ></a
                                                ><br /><br />
                                            </li>
                                        </template>
                                    </ul>
                                </div>

                                <!-- Skills Section -->
                                <h2 class="rit-titl">
                                    <i class="fas fa-users-cog"></i>
                                    <span x-text="data.skills.header"></span>
                                </h2>
                                <div class="skills">
                                    <template
                                        x-for="group in data.skills.skills"
                                    >
                                        <div class="mb-3">
                                            <strong
                                                x-text="group.name"
                                            ></strong>
                                            <ul class="row no-margin mt-2">
                                                <template
                                                    x-for="skill in group.data"
                                                >
                                                    <li x-text="skill"></li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p id="footerText">
                &copy; <span x-text="data.misc.name || 'Anttu Suhonen'"></span>
            </p>
        </footer>
    </body>
</html>
